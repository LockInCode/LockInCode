# Змейка, которая "съедает" граф контрибуций и рендерит SVG-анимацию.
# Это самый эффектный виджет профиля. Требует, чтобы воркфлоу лежал в репозитории
# LockInWeb3/LockInWeb3 (профильный репозиторий).
#
# Важно: в README путь к картинке должен совпадать с веткой "output".
# По умолчанию ниже используется branch_name: output (рекомендуется).

name: Generate snake animation

on:
  # Пересобирать раз в 12 часов
  schedule:
    - cron: "0 */12 * * *"
  # Позволяет запускать вручную из вкладки Actions
  workflow_dispatch:
  # И при каждом пуше в main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
